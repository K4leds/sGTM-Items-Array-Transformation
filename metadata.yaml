- sha: 7482b95b1d4c739af4579d84dafe2785a07dafd0
  changeNotes: |-
    Initial gallery release.

    Transforms the GA4 items array in a server-side container:

    - Item filtering: keep only, or drop, whole items by field conditions
    - Parameter actions: add, drop or replace parameters, conditionally or
      unconditionally, plus a drop-empty pass
    - Value transformation: find and replace inside values, with regex
    - Data type casting: number, integer and string
    - Added values: static key-value pairs and an optional per-item index
    - Key mapping: rename keys, optionally discarding unmapped ones

    Contains, Equals, Starts With, Ends With and Regex matching are
    available throughout. An invalid regex skips its own rule and logs,
    rather than failing the variable.
